name: Build on Tag
on:
  push:
    tags: [v*]
env:
  FRONTEND_DIR: ./vue
  LINT_ENABLED: true
jobs:
  build:
    runs-on: ubuntu-latest
    # Vite bakes the API URLs per mode, so we build both:
    #   staging    -> :<tag>-staging  (deployed to std-dive-logger-dev)
    #   production -> :<tag>           (deployed to std-dive-logger-prod)
    # Each binds its matching GitHub Environment for that domain's CARTO key.
    # PRODUCTION doesn't exist yet -> its CARTO_API_KEY is empty (keyless
    # public basemap) until it's created; the build still succeeds.
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: staging
            environment: STAGING
          - mode: production
            environment: PRODUCTION
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Test and Lint
        uses: ./.github/actions/test-and-lint
        with:
          frontend-dir: ${{ env.FRONTEND_DIR }}
          lint-enabled: ${{ env.LINT_ENABLED }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build with Dockerfile
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: bash ./build-frontend.sh ${{ github.ref_name }} ${{ matrix.mode }}
