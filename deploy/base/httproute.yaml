---
# Base hostname is the PROD one - the dev overlay patches it to
# std-dive-logger-web-dev.sthomas.ch. Traefik is the public edge (cert-manager
# gateway certs).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: std-dive-logger-web
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - std-dive-logger-web.sthomas.ch
  rules:
    - backendRefs:
        - name: std-dive-logger-web
          port: 80
